<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Problem — Solvr</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="toast-container" id="toast-container"></div>

  <nav id="navbar">
    <a href="index.html" class="logo">Solvr</a>
    
    <div class="nav-right">
      <div id="nav-user-pill" style="display:none"></div>
      <button class="btn-primary" id="nav-post-btn" onclick="window.location.href='submit.html'">
        + Post a Problem
      </button>
      <button class="btn-secondary" id="nav-auth-btn" onclick="handleAuthClick()" style="display:none">
        Sign In
      </button>
      <div class="hamburger" onclick="toggleMenu()">
        <span></span><span></span><span></span>
      </div>
    </div>
  </nav>

  <div class="nav-drawer" id="nav-drawer">
    <a href="index.html">Browse Problems</a>
    <a href="submit.html">Post a Problem</a>
  </div>

  <div class="modal-overlay" id="sol-modal">
    <div class="modal">
      <div class="modal-icon">◎</div>
      <h3>Sending SOL Reward</h3>
      <p id="modal-desc">Processing transaction on Solana Devnet...</p>
      <div class="progress-bar-wrap">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <p class="tx-status" id="tx-status">Initiating transaction...</p>
      <div class="tx-success" id="tx-success">
        <p>✓ Transaction confirmed!</p>
        <p class="tx-hash" id="tx-hash"></p>
      </div>
      <button class="btn-primary" id="modal-close-btn" onclick="closeModal()"
        style="display:none; width:100%; padding:12px; border-radius:8px;">
        Done
      </button>
    </div>
  </div>

  <div class="container">
    <a href="index.html" class="back-link">← Back to feed</a>

    <div id="problem-detail">
      <p class="empty">Loading...</p>
    </div>

    <div id="prototypes-section" style="display:none">
      <p class="section-heading">Submitted prototypes</p>
      <div id="prototypes-list"></div>

      <p class="section-heading">Submit your prototype</p>
      <div class="form-container" style="padding:24px">
        <div class="field">
          <label>Your Name</label>
          <input type="text" id="builder-name" placeholder="e.g. Ansh Dev" />
        </div>
        <div class="field">
          <label>Live URL</label>
          <input type="text" id="live-url" placeholder="https://your-demo.vercel.app" />
        </div>
        <div class="field">
          <label>What did you build?</label>
          <textarea id="proto-description" placeholder="Brief description of your solution..."></textarea>
        </div>
        <div class="field">
          <label>Demo Video URL (optional)</label>
          <input type="text" id="video-url" placeholder="https://youtube.com/..." />
        </div>
        <button class="btn-primary" onclick="submitPrototype()"
          style="width:100%; padding:13px; font-size:15px; border-radius:10px;">
          Submit Prototype
        </button>
      </div>
    </div>
  </div>

  <script type="module">
    import { supabase } from './supabase.js'

    // ── TOAST ──
    window.showToast = function(message, type = 'info') {
      const container = document.getElementById('toast-container')
      const toast = document.createElement('div')
      toast.className = `toast ${type}`
      const icons = { success: '✓', error: '✕', warning: '⚠', info: 'ℹ' }
      toast.innerHTML = `<span>${icons[type] || 'ℹ'}</span><span>${message}</span>`
      container.appendChild(toast)
      setTimeout(() => {
        toast.classList.add('removing')
        setTimeout(() => toast.remove(), 300)
      }, 3000)
    }

    // ── AUTH STATE IN NAVBAR ──
    const { data: { session } } = await supabase.auth.getSession()
    const userPill = document.getElementById('nav-user-pill')
    const authBtn = document.getElementById('nav-auth-btn')

    if (session) {
      const name = session.user.user_metadata?.full_name || session.user.email
      const initial = name.charAt(0).toUpperCase()
      const firstName = name.split(' ')[0]

      userPill.style.display = 'flex'
      userPill.innerHTML = `
        <div class="user-pill">
          <div class="user-avatar">${initial}</div>
          <span class="user-name">${firstName}</span>
        </div>
      `
      authBtn.style.display = 'block'
      authBtn.textContent = 'Sign Out'

      const fullName = session.user.user_metadata?.full_name
      if (fullName) document.getElementById('builder-name').value = fullName
    } else {
      authBtn.style.display = 'block'
    }

    window.handleAuthClick = async function() {
      if (session) {
        await supabase.auth.signOut()
        window.location.href = 'index.html'
      } else {
        window.location.href = 'auth.html'
      }
    }

    window.addEventListener('scroll', () => {
      document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 20)
    })

    // ── PROBLEM DETAIL ──
    const params = new URLSearchParams(window.location.search)
    const problemId = params.get('id')
    let currentProblem = null
    let solvedProtoId = null

    if (!problemId) window.location.href = 'index.html'

    loadProblem()
    loadPrototypes()

    async function loadProblem() {
      const { data, error } = await supabase
        .from('problems').select('*').eq('id', problemId).single()

      if (error || !data) {
        document.getElementById('problem-detail').innerHTML = '<p class="empty">Problem not found.</p>'
        return
      }

      currentProblem = data
      const isOwner = session && session.user.id === data.user_id

      document.getElementById('problem-detail').innerHTML = `
        <div class="problem-header">
          <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:12px; flex-wrap:wrap;">
            <h1>${data.title}</h1>
            <div class="badges">
              <span class="badge badge-${data.status}">${data.status}</span>
              <span class="badge badge-${data.difficulty}">${data.difficulty || ''}</span>
            </div>
          </div>

          <div class="badges" style="margin-bottom:8px">
            <span class="badge badge-domain">${data.domain || ''}</span>
            <span class="badge badge-domain">${data.category || ''}</span>
            ${(data.ai_tags || '').split(',').filter(t => t.trim()).map(tag =>
              `<span class="badge badge-tag">${tag.trim()}</span>`
            ).join('')}
          </div>

          <p style="font-size:13px; color:#9ca3af; margin-top:8px;">
            Posted by <strong>${data.poster_name}</strong>
          </p>

          ${isOwner ? `
            <div class="poster-actions">
              <button class="btn-edit" onclick="editProblem()">✏️ Edit</button>
              <button class="btn-delete" onclick="deleteProblem()">🗑 Delete</button>
            </div>
          ` : ''}
        </div>

        ${data.image_url ? `<img src="${data.image_url}" class="problem-image" />` : ''}

        <div class="problem-body">${data.description}</div>

        <div class="ai-brief">
          <div class="ai-brief-label">✦ AI Builder Brief</div>
          <p>${data.builder_brief || ''}</p>
        </div>

        ${data.reward_sol && data.reward_sol > 0 ? `
          <div class="reward-box">
            <div style="display:flex; align-items:center; gap:16px;">
              <div style="font-size:36px;">◎</div>
              <div>
                <div style="font-size:12px; color:#b45309; font-weight:600; margin-bottom:2px; text-transform:uppercase; letter-spacing:0.05em;">SOL Reward for Solver</div>
                <div class="reward-sol-amount">◎ ${data.reward_sol} SOL</div>
                <div class="reward-inr">≈ ₹${Math.round(data.reward_sol * 6400).toLocaleString()} estimated · Paid on Solana Devnet</div>
              </div>
            </div>
            <span class="solana-badge">Powered by Solana</span>
          </div>
        ` : ''}

        <div class="stats">
          <div class="stat">
            <div class="stat-num">${data.challenge_count || 0}</div>
            <div class="stat-label">Builders accepted</div>
          </div>
          <div class="stat">
            <div class="stat-num">${data.prototype_count || 0}</div>
            <div class="stat-label">Prototypes submitted</div>
          </div>
          <div class="stat">
            <div class="stat-num">${data.status === 'solved' ? '1' : '0'}</div>
            <div class="stat-label">Marked solved</div>
          </div>
        </div>
      `

      document.getElementById('prototypes-section').style.display = 'block'
    }

    async function loadPrototypes() {
      const { data, error } = await supabase
        .from('prototypes').select('*').eq('problem_id', problemId)
        .order('submitted_at', { ascending: false })

      const list = document.getElementById('prototypes-list')

      if (error || !data || data.length === 0) {
        list.innerHTML = `
          <div class="empty" style="padding:24px">
            <div class="empty-icon">🔨</div>
            <p>No prototypes yet. Be the first to build one.</p>
          </div>`
        return
      }

      const isOwner = session && currentProblem && session.user.id === currentProblem.user_id

      list.innerHTML = data.map(proto => `
        <div class="prototype-card ${proto.marked_solved ? 'winner' : ''}">
          <div style="flex:1">
            <a href="${proto.live_url}" target="_blank" class="prototype-title">${proto.live_url}</a>
            <p class="prototype-sub">by ${proto.builder_name}</p>
            <p class="prototype-desc">${proto.description}</p>
            ${proto.marked_solved
              ? '<span class="winner-badge" style="margin-top:8px; display:inline-block;">👑 Solution accepted</span>'
              : ''
            }
          </div>
          ${isOwner && !proto.marked_solved ? `
            <button class="btn-solved" onclick="markSolved('${proto.id}', '${proto.builder_name}')">
              Mark as solved
            </button>
          ` : ''}
        </div>
      `).join('')
    }

    window.submitPrototype = async function() {
      const builderName = document.getElementById('builder-name').value.trim()
      const liveUrl = document.getElementById('live-url').value.trim()
      const description = document.getElementById('proto-description').value.trim()
      const videoUrl = document.getElementById('video-url').value.trim()

      if (!builderName || !liveUrl || !description) {
        showToast('Please fill in your name, live URL and description.', 'error')
        return
      }

      const { error } = await supabase.from('prototypes').insert({
        problem_id: problemId,
        builder_name: builderName,
        live_url: liveUrl,
        description,
        demo_video_url: videoUrl || null,
        marked_solved: false
      })

      if (error) { showToast('Something went wrong. Please try again.', 'error'); return }

      const { data: problem } = await supabase
        .from('problems').select('prototype_count').eq('id', problemId).single()
      await supabase.from('problems')
        .update({ prototype_count: (problem.prototype_count || 0) + 1 })
        .eq('id', problemId)

      showToast('Prototype submitted successfully!', 'success')
      loadPrototypes()
    }

    window.markSolved = async function(prototypeId, builderName) {
      if (!session) {
        showToast('Please sign in to mark problems as solved.', 'warning')
        setTimeout(() => window.location.href = 'auth.html', 1500)
        return
      }

      if (session.user.id !== currentProblem.user_id) {
        showToast('Only the problem poster can mark a solution as solved.', 'error')
        return
      }

      solvedProtoId = prototypeId

      if (currentProblem && currentProblem.reward_sol > 0) {
        showSolModal(builderName)
      } else {
        await completeSolve(prototypeId)
        showToast('Problem marked as solved! 🎉', 'success')
        loadProblem()
        loadPrototypes()
      }
    }

    async function completeSolve(prototypeId) {
      await supabase.from('prototypes').update({ marked_solved: true }).eq('id', prototypeId)
      await supabase.from('problems').update({ status: 'solved' }).eq('id', problemId)
    }

    function showSolModal(builderName) {
      const modal = document.getElementById('sol-modal')
      const bar = document.getElementById('progress-bar')
      const status = document.getElementById('tx-status')
      const success = document.getElementById('tx-success')
      const closeBtn = document.getElementById('modal-close-btn')
      const hash = document.getElementById('tx-hash')

      document.getElementById('modal-desc').textContent =
        `Sending ◎ ${currentProblem.reward_sol} SOL to ${builderName} on Solana Devnet...`

      bar.style.width = '0%'
      status.textContent = 'Initiating transaction...'
      success.style.display = 'none'
      closeBtn.style.display = 'none'
      modal.classList.add('show')

      setTimeout(() => { bar.style.width = '40%'; status.textContent = 'Signing transaction...' }, 400)
      setTimeout(() => { bar.style.width = '75%'; status.textContent = 'Confirming on Solana Devnet...' }, 1200)
      setTimeout(async () => {
        bar.style.width = '100%'
        status.textContent = 'Transaction confirmed!'

        const fakeHash = Array.from({length: 44}, () =>
          'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz123456789'[Math.floor(Math.random() * 58)]
        ).join('')
        hash.textContent = 'TX: ' + fakeHash

        success.style.display = 'block'
        closeBtn.style.display = 'block'

        await completeSolve(solvedProtoId)
        showToast('SOL reward sent successfully! 🎉', 'success')
        loadProblem()
        loadPrototypes()
      }, 2400)
    }

    window.closeModal = function() {
      document.getElementById('sol-modal').classList.remove('show')
    }

    // Close modal on overlay click
    document.getElementById('sol-modal').addEventListener('click', function(e) {
      if (e.target === this) closeModal()
    })

    window.editProblem = async function() {
      if (!session || session.user.id !== currentProblem.user_id) {
        showToast('You can only edit your own problems.', 'error')
        return
      }

      const newTitle = prompt('Edit problem title:', currentProblem.title)
      if (!newTitle || newTitle.trim() === currentProblem.title) return

      const newDescription = prompt('Edit description:', currentProblem.description)
      if (newDescription === null) return

      const { error } = await supabase.from('problems').update({
        title: newTitle.trim(),
        description: newDescription.trim()
      }).eq('id', problemId)

      if (error) { showToast('Could not update: ' + error.message, 'error'); return }

      showToast('Problem updated successfully!', 'success')
      loadProblem()
    }

    window.deleteProblem = async function() {
      if (!session || session.user.id !== currentProblem.user_id) {
        showToast('You can only delete your own problems.', 'error')
        return
      }

      if (!confirm('Are you sure you want to delete this problem? This cannot be undone.')) return

      const { error: protoError } = await supabase
        .from('prototypes').delete().eq('problem_id', problemId)

      if (protoError) { showToast('Could not delete: ' + protoError.message, 'error'); return }

      const { error } = await supabase
        .from('problems').delete().eq('id', problemId)

      if (error) { showToast('Could not delete: ' + error.message, 'error'); return }

      showToast('Problem deleted.', 'success')
      setTimeout(() => window.location.href = 'index.html', 1000)
    }

    window.toggleMenu = function() {
      document.getElementById('nav-drawer').classList.toggle('open')
    }

  </script>
</body>
</html>
