<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Problem — Solvr</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav>
    <a href="index.html" class="logo">Solvr</a>
   <div class="nav-links">
  <a href="index.html">Browse</a>
</div>
    <div class="nav-right">
      <button class="btn-primary" onclick="window.location.href='index.html'">
        Browse Problems
      </button>
      <div class="hamburger" onclick="toggleMenu()">
        <span></span><span></span><span></span>
      </div>
    </div>
  </nav>

  <div class="nav-drawer" id="nav-drawer">
    <a href="index.html">Browse Problems</a>
    <a href="submit.html">Post a Problem</a>
  </div>

  <!-- SOL Transaction Modal -->
  <div class="modal-overlay" id="sol-modal">
    <div class="modal">
      <div class="modal-icon">◎</div>
      <h3>Sending SOL Reward</h3>
      <p id="modal-desc">Processing transaction on Solana Devnet...</p>
      <div class="progress-bar-wrap">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <p class="tx-status" id="tx-status">Initiating transaction...</p>
      <div class="tx-success" id="tx-success">
        <p>✓ Transaction confirmed!</p>
        <p class="tx-hash" id="tx-hash"></p>
      </div>
      <button class="btn-primary" id="modal-close-btn" onclick="closeModal()" style="display:none; width:100%; padding:12px; border-radius:8px;">
        Done
      </button>
    </div>
  </div>

  <div class="container">
    <a href="index.html" class="back-link">← Back to feed</a>

    <div id="problem-detail">
      <p class="empty">Loading...</p>
    </div>

    <div id="prototypes-section" style="display:none">
      <p class="section-heading">Submitted prototypes</p>
      <div id="prototypes-list"></div>

      <p class="section-heading">Submit your prototype</p>
      <div class="form-container" style="padding:24px">
        <div class="field">
          <label>Your Name</label>
          <input type="text" id="builder-name" placeholder="e.g. Ansh Dev" />
        </div>
        <div class="field">
          <label>Live URL</label>
          <input type="text" id="live-url" placeholder="https://your-demo.vercel.app" />
        </div>
        <div class="field">
          <label>What did you build?</label>
          <textarea id="proto-description" placeholder="Brief description of your solution..."></textarea>
        </div>
        <div class="field">
          <label>Demo Video URL (optional)</label>
          <input type="text" id="video-url" placeholder="https://youtube.com/..." />
        </div>
        <button class="btn-primary" onclick="submitPrototype()"
          style="width:100%; padding:13px; font-size:15px; border-radius:10px;">
          Submit Prototype
        </button>
      </div>
    </div>
  </div>

  <script type="module">
    import { supabase } from './supabase.js'

    const params = new URLSearchParams(window.location.search)
    const problemId = params.get('id')
    let currentProblem = null
    let solvedProtoId = null

    if (!problemId) window.location.href = 'index.html'

    loadProblem()
    loadPrototypes()

    async function loadProblem() {
      const { data, error } = await supabase
        .from('problems').select('*').eq('id', problemId).single()

      if (error || !data) {
        document.getElementById('problem-detail').innerHTML = '<p class="empty">Problem not found.</p>'
        return
      }

      currentProblem = data

      document.getElementById('problem-detail').innerHTML = `
        <div class="problem-header">
          <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:12px; flex-wrap:wrap;">
            <h1>${data.title}</h1>
            <div class="badges">
              <span class="badge badge-${data.status}">${data.status}</span>
              <span class="badge badge-${data.difficulty}">${data.difficulty || ''}</span>
            </div>
          </div>
          <div class="badges" style="margin-bottom:8px">
            <span class="badge badge-domain">${data.domain || ''}</span>
            <span class="badge badge-domain">${data.category || ''}</span>
            ${(data.ai_tags || '').split(',').filter(t => t.trim()).map(tag =>
              `<span class="badge badge-tag">${tag.trim()}</span>`
            ).join('')}
          </div>
          <p style="font-size:13px; color:#9ca3af; margin-top:8px;">Posted by ${data.poster_name}</p>

          <div class="poster-actions">
            <button class="btn-edit" onclick="editProblem()">✏️ Edit</button>
            <button class="btn-delete" onclick="deleteProblem()">🗑 Delete</button>
          </div>
        </div>

        ${data.image_url ? `<img src="${data.image_url}" class="problem-image" />` : ''}

        <div class="problem-body">${data.description}</div>

        <div class="ai-brief">
          <div class="ai-brief-label">✦ AI Builder Brief</div>
          <p>${data.builder_brief || ''}</p>
        </div>

        ${data.reward_sol && data.reward_sol > 0 ? `
          <div class="reward-box">
            <div class="reward-box-left">
              <div>
                <div style="font-size:12px; color:#b45309; font-weight:600; margin-bottom:2px;">◎ SOL Reward</div>
                <div class="reward-sol-amount">◎ ${data.reward_sol} SOL</div>
                <div class="reward-inr">≈ ₹${Math.round(data.reward_sol * 6400).toLocaleString()} estimated</div>
              </div>
            </div>
            <div style="text-align:right;">
              <div style="font-size:12px; color:#b45309;">Paid to solver on Solana</div>
              <span class="solana-badge" style="margin-top:6px; display:inline-block;">Powered by Solana</span>
            </div>
          </div>
        ` : ''}

        <div class="stats">
          <div class="stat">
            <div class="stat-num">${data.challenge_count || 0}</div>
            <div class="stat-label">Builders accepted</div>
          </div>
          <div class="stat">
            <div class="stat-num">${data.prototype_count || 0}</div>
            <div class="stat-label">Prototypes submitted</div>
          </div>
          <div class="stat">
            <div class="stat-num">${data.status === 'solved' ? '1' : '0'}</div>
            <div class="stat-label">Marked solved</div>
          </div>
        </div>
      `

      document.getElementById('prototypes-section').style.display = 'block'
    }

    async function loadPrototypes() {
      const { data, error } = await supabase
        .from('prototypes').select('*').eq('problem_id', problemId).order('submitted_at', { ascending: false })

      const list = document.getElementById('prototypes-list')

      if (error || !data || data.length === 0) {
        list.innerHTML = '<div class="empty" style="padding:24px"><div class="empty-icon">🔨</div><p>No prototypes yet. Be the first to build one.</p></div>'
        return
      }

      list.innerHTML = data.map(proto => `
        <div class="prototype-card ${proto.marked_solved ? 'winner' : ''}">
          <div style="flex:1">
            <a href="${proto.live_url}" target="_blank" class="prototype-title">${proto.live_url}</a>
            <p class="prototype-sub">by ${proto.builder_name}</p>
            <p class="prototype-desc">${proto.description}</p>
            ${proto.marked_solved ? '<span class="winner-badge" style="margin-top:8px; display:inline-block;">👑 Solution accepted</span>' : ''}
          </div>
          ${!proto.marked_solved ? `
            <button class="btn-solved" onclick="markSolved('${proto.id}', '${proto.builder_name}')">
              Mark as solved
            </button>
          ` : ''}
        </div>
      `).join('')
    }

    window.submitPrototype = async function() {
      const builderName = document.getElementById('builder-name').value.trim()
      const liveUrl = document.getElementById('live-url').value.trim()
      const description = document.getElementById('proto-description').value.trim()
      const videoUrl = document.getElementById('video-url').value.trim()

      if (!builderName || !liveUrl || !description) {
        alert('Please fill in your name, live URL and description.')
        return
      }

      const { error } = await supabase.from('prototypes').insert({
        problem_id: problemId,
        builder_name: builderName,
        live_url: liveUrl,
        description,
        demo_video_url: videoUrl || null,
        marked_solved: false
      })

      if (error) { alert('Something went wrong. Please try again.'); return }

      const { data: problem } = await supabase.from('problems').select('prototype_count').eq('id', problemId).single()
      await supabase.from('problems').update({ prototype_count: (problem.prototype_count || 0) + 1 }).eq('id', problemId)

      alert('Prototype submitted successfully!')
      loadPrototypes()
    }

    window.markSolved = async function(prototypeId, builderName) {
      solvedProtoId = prototypeId

      if (currentProblem && currentProblem.reward_sol > 0) {
        showSolModal(builderName)
      } else {
        await completeSolve(prototypeId)
        alert('Problem marked as solved!')
        loadProblem()
        loadPrototypes()
      }
    }

    async function completeSolve(prototypeId) {
      await supabase.from('prototypes').update({ marked_solved: true }).eq('id', prototypeId)
      await supabase.from('problems').update({ status: 'solved' }).eq('id', problemId)
    }

    function showSolModal(builderName) {
      const modal = document.getElementById('sol-modal')
      const bar = document.getElementById('progress-bar')
      const status = document.getElementById('tx-status')
      const success = document.getElementById('tx-success')
      const closeBtn = document.getElementById('modal-close-btn')
      const hash = document.getElementById('tx-hash')

      document.getElementById('modal-desc').textContent =
        `Sending ◎ ${currentProblem.reward_sol} SOL to ${builderName} on Solana Devnet...`

      bar.style.width = '0%'
      status.textContent = 'Initiating transaction...'
      success.style.display = 'none'
      closeBtn.style.display = 'none'
      modal.classList.add('show')

      setTimeout(() => { bar.style.width = '40%'; status.textContent = 'Signing transaction...' }, 400)
      setTimeout(() => { bar.style.width = '75%'; status.textContent = 'Confirming on Solana Devnet...' }, 1200)
      setTimeout(async () => {
        bar.style.width = '100%'
        status.textContent = 'Transaction confirmed!'

        const fakeHash = Array.from({length: 44}, () => 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz123456789'[Math.floor(Math.random() * 58)]).join('')
        hash.textContent = 'TX: ' + fakeHash

        success.style.display = 'block'
        closeBtn.style.display = 'block'

        await completeSolve(solvedProtoId)
        loadProblem()
        loadPrototypes()
      }, 2400)
    }

    window.closeModal = function() {
      document.getElementById('sol-modal').classList.remove('show')
    }

    window.editProblem = function() {
      const newTitle = prompt('Edit problem title:', currentProblem.title)
      if (!newTitle || newTitle.trim() === currentProblem.title) return
      supabase.from('problems').update({ title: newTitle.trim() }).eq('id', problemId)
        .then(() => { alert('Problem updated!'); loadProblem() })
    }

   window.deleteProblem = async function() {
  if (!confirm('Are you sure you want to delete this problem? This cannot be undone.')) return

  // First delete all prototypes linked to this problem
  const { error: protoError } = await supabase
    .from('prototypes')
    .delete()
    .eq('problem_id', problemId)

  if (protoError) {
    alert('Could not delete prototypes: ' + protoError.message)
    return
  }

  // Then delete the problem itself
  const { error } = await supabase
    .from('problems')
    .delete()
    .eq('id', problemId)

  if (error) {
    alert('Could not delete problem: ' + error.message)
    return
  }

  alert('Problem deleted successfully.')
  window.location.href = 'index.html'
}

    window.toggleMenu = function() {
      document.getElementById('nav-drawer').classList.toggle('open')
    }

  </script>
</body>
</html>
