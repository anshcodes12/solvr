<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Solvr</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      padding: 20px;
    }

    .auth-box {
      background: white;
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      animation: slideUp 0.4s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .auth-logo {
      font-size: 28px;
      font-weight: 800;
      color: #4f46e5;
      text-align: center;
      margin-bottom: 8px;
    }

    .auth-tagline {
      text-align: center;
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 32px;
    }

    .auth-tabs {
      display: flex;
      background: #f3f4f6;
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 28px;
    }

    .auth-tab {
      flex: 1;
      padding: 9px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      color: #6b7280;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .auth-tab.active {
      background: white;
      color: #4f46e5;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .auth-field {
      margin-bottom: 16px;
    }

    .auth-field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }

    .auth-field input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      font-size: 14px;
      color: #111827;
      background: #fafafa;
      outline: none;
      transition: all 0.2s;
      font-family: inherit;
    }

    .auth-field input:focus {
      border-color: #4f46e5;
      background: white;
      box-shadow: 0 0 0 3px rgba(79,70,229,0.08);
    }

    .auth-btn {
      width: 100%;
      padding: 13px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
      font-family: inherit;
    }

    .auth-btn:hover {
      background: #4338ca;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(79,70,229,0.3);
    }

    .auth-btn:active {
      transform: scale(0.98);
    }

    .auth-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .auth-error {
      background: #fee2e2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #dc2626;
      margin-bottom: 16px;
      display: none;
    }

    .auth-success {
      background: #dcfce7;
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #15803d;
      margin-bottom: 16px;
      display: none;
    }

    .auth-divider {
      text-align: center;
      font-size: 12px;
      color: #9ca3af;
      margin: 20px 0;
      position: relative;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 42%;
      height: 1px;
      background: #e5e7eb;
    }

    .auth-divider::before { left: 0; }
    .auth-divider::after { right: 0; }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #6b7280;
      text-decoration: none;
      transition: color 0.2s;
    }

    .back-home:hover { color: #4f46e5; }
  </style>
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-box">

      <div class="auth-logo">Solvr</div>
      <p class="auth-tagline">Open platform for innovators</p>

      <div class="auth-tabs">
        <div class="auth-tab active" id="tab-login" onclick="switchTab('login')">Sign In</div>
        <div class="auth-tab" id="tab-signup" onclick="switchTab('signup')">Sign Up</div>
      </div>

      <div id="error-msg" class="auth-error"></div>
      <div id="success-msg" class="auth-success"></div>

      <!-- Login form -->
      <div id="login-form">
        <div class="auth-field">
          <label>Email</label>
          <input type="email" id="login-email" placeholder="you@example.com" />
        </div>
        <div class="auth-field">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="Your password" />
        </div>
        <button class="auth-btn" id="login-btn" onclick="handleLogin()">
          Sign In
        </button>
      </div>

      <!-- Signup form -->
      <div id="signup-form" style="display:none">
        <div class="auth-field">
          <label>Your Name</label>
          <input type="text" id="signup-name" placeholder="e.g. Ansh Agnihotri" />
        </div>
        <div class="auth-field">
          <label>Email</label>
          <input type="email" id="signup-email" placeholder="you@example.com" />
        </div>
        <div class="auth-field">
          <label>Password</label>
          <input type="password" id="signup-password" placeholder="Min 6 characters" />
        </div>
        <button class="auth-btn" id="signup-btn" onclick="handleSignup()">
          Create Account
        </button>
      </div>

      <a href="index.html" class="back-home">← Back to homepage</a>

    </div>
  </div>

  <script type="module">
    import { supabase } from './supabase.js'

    // If already logged in redirect to homepage
    const { data: { session } } = await supabase.auth.getSession()
    if (session) window.location.href = 'index.html'

    window.switchTab = function(tab) {
      document.getElementById('login-form').style.display = tab === 'login' ? 'block' : 'none'
      document.getElementById('signup-form').style.display = tab === 'signup' ? 'block' : 'none'
      document.getElementById('tab-login').classList.toggle('active', tab === 'login')
      document.getElementById('tab-signup').classList.toggle('active', tab === 'signup')
      hideMessages()
    }

    function showError(msg) {
      const el = document.getElementById('error-msg')
      el.textContent = msg
      el.style.display = 'block'
      document.getElementById('success-msg').style.display = 'none'
    }

    function showSuccess(msg) {
      const el = document.getElementById('success-msg')
      el.textContent = msg
      el.style.display = 'block'
      document.getElementById('error-msg').style.display = 'none'
    }

    function hideMessages() {
      document.getElementById('error-msg').style.display = 'none'
      document.getElementById('success-msg').style.display = 'none'
    }

    window.handleLogin = async function() {
      const email = document.getElementById('login-email').value.trim()
      const password = document.getElementById('login-password').value

      if (!email || !password) {
        showError('Please fill in both fields.')
        return
      }

      const btn = document.getElementById('login-btn')
      btn.disabled = true
      btn.textContent = 'Signing in...'

      const { error } = await supabase.auth.signInWithPassword({ email, password })

      if (error) {
        showError(error.message)
        btn.disabled = false
        btn.textContent = 'Sign In'
        return
      }

      showSuccess('Signed in successfully! Redirecting...')
const redirect = localStorage.getItem('redirect_after_auth') || 'index.html'
localStorage.removeItem('redirect_after_auth')
setTimeout(() => window.location.href = redirect, 1000)
    }

    window.handleSignup = async function() {
      const name = document.getElementById('signup-name').value.trim()
      const email = document.getElementById('signup-email').value.trim()
      const password = document.getElementById('signup-password').value

      if (!name || !email || !password) {
        showError('Please fill in all fields.')
        return
      }

      if (password.length < 6) {
        showError('Password must be at least 6 characters.')
        return
      }

      const btn = document.getElementById('signup-btn')
      btn.disabled = true
      btn.textContent = 'Creating account...'

      const { error } = await supabase.auth.signUp({
        email,
        password,
        options: { data: { full_name: name } }
      })

      if (error) {
        showError(error.message)
        btn.disabled = false
        btn.textContent = 'Create Account'
        return
      }

      showSuccess('Signed in successfully! Redirecting...')
const redirect = localStorage.getItem('redirect_after_auth') || 'index.html'
localStorage.removeItem('redirect_after_auth')
setTimeout(() => window.location.href = redirect, 1000)
    }

    // Allow pressing Enter to submit
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const loginVisible = document.getElementById('login-form').style.display !== 'none'
        if (loginVisible) handleLogin()
        else handleSignup()
      }
    })

  </script>
</body>
</html>
